name: CI

# Lint e testes a cada push e pull request. A suíte inteira roda offline,
# contra as amostras de data/fixtures/, então este workflow não usa segredos
# nem toca a rede das fontes.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # O mesmo arquivo que o Streamlit Community Cloud usa: se a
          # resolução quebrar aqui, quebraria no deploy também.
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint
        run: ruff check src tests scripts

      - name: Testes
        run: pytest -q
