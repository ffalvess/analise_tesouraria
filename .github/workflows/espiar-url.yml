name: Espiar URL

# Descreve o que uma URL devolve, de dentro da rede aberta do runner.
#
# Existe por causa da restrição que encarece toda correção de fonte neste
# projeto: os hosts financeiros (bcb.gov.br, b3.com.br, anbima) não respondem
# do ambiente de desenvolvimento. Sem ver a resposta, escrever um parser é
# adivinhar a estrutura — e foi assim que os códigos do fluxo cambial entraram
# errados e sobreviveram meses.
#
# Não coleta nada e não grava nada: só relata. Útil para achar o arquivo que
# uma página oferece (--filtro), ver as abas de uma planilha antes de escrever
# o parser, ou descobrir que um endpoint devolve página de erro com status 200
# — que é o caso do boletim legado da B3.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Endereço a inspecionar"
        required: true
        type: string
      filtro:
        description: "Numa página HTML, só lista os links que contenham este texto"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  espiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Espiar
        run: |
          if [ -n "${{ inputs.filtro }}" ]; then
            tesouraria espiar "${{ inputs.url }}" --filtro "${{ inputs.filtro }}"
          else
            tesouraria espiar "${{ inputs.url }}"
          fi
