name: Sondar séries do SGS

# Ferramenta de diagnóstico, disparada à mão.
#
# A consulta ao SGS não valida nada: um código errado não dá erro, devolve
# outra série. Foi assim que os códigos anotados como fluxo cambial entraram no
# projeto trazendo outra coisa — e como isso só apareceu depois de meses de
# dados coletados.
#
# Para descobrir o código a partir do nome, use antes o workflow 'Buscar séries
# do SGS pelo nome'. Esta sonda é o passo de confirmação: dado um código, o que
# ele de fato devolve.
#
# Esta sonda varre uma faixa de códigos e descreve o que cada um devolve:
# periodicidade, intervalo de datas, ordem de grandeza e se o sinal alterna.
# É o bastante para reconhecer a série procurada no log e preenchê-la em
# config/sources.yaml.
#
# Para o fluxo cambial contratado, procure séries **semanais**, em milhares de
# US$ milhões, com sinal que **alterna** — entrada e saída líquidas.

on:
  workflow_dispatch:
    inputs:
      de:
        description: "Primeiro código da faixa (ex.: 22600)"
        required: true
        type: string
      ate:
        description: "Último código da faixa (ex.: 22800)"
        required: true
        type: string
      amostra:
        description: "Observações por série"
        required: false
        default: "24"
        type: string
      timeout:
        description: "Segundos por código antes de desistir"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sondar a faixa
        run: |
          tesouraria sgs-probe \
            --de ${{ inputs.de }} \
            --ate ${{ inputs.ate }} \
            --amostra ${{ inputs.amostra }} \
            --timeout ${{ inputs.timeout }}
