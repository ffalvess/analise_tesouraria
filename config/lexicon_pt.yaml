# Léxico de tom de política monetária em português (BCB / Copom).
#
# Pesos entre 0 e 2: quanto mais inequívoco o termo, maior o peso. Expressões
# de mais de uma palavra são casadas antes das palavras isoladas, para que
# "juro real" não conte como neutro e "cautela" não sobreponha "cautela e
# serenidade".
#
# A pontuação final é (hawk - dove) / (hawk + dove), no intervalo [-1, 1].

negacoes: ["não", "nao", "sem", "nenhum", "nenhuma", "tampouco", "jamais"]

# Palavras que, precedidas de negação até 3 tokens antes, trocam de lado.
janela_negacao: 3

