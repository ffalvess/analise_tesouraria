# Léxico de tom de política monetária em inglês (Fed / FOMC).
#
# Mesma mecânica do léxico em português: pesos entre 0 e 2, expressões
# compostas casadas antes de palavras isoladas, e negação até 3 tokens antes
# invertendo o lado do termo.

negacoes: ["not", "no", "without", "neither", "nor", "never", "nothing"]

janela_negacao: 3

