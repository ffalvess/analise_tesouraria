# Feeds de comunicação oficial e de análise pública.
#
# Só entram aqui fontes abertas. Pesquisa sell-side (Itaú, BTG, XP, Goldman,
# Santander e afins) é conteúdo licenciado e não é coletada por este aplicativo
# — para esses relatórios, use a pasta `data/research_pdfs/`, onde você deposita
# o que já recebe por direito e o app extrai o texto localmente.
#
# Acrescente ou remova feeds à vontade: a ingestão lê esta lista a cada execução.

discursos:
  - nome: "Fed — Speeches"
    instituicao: Fed
    url: "https://www.federalreserve.gov/feeds/speeches.xml"
    tipo: discurso
    idioma: en

  - nome: "Fed — Testimony"
    instituicao: Fed
    url: "https://www.federalreserve.gov/feeds/testimony.xml"
    tipo: discurso
    idioma: en

  - nome: "Fed — Comunicados de política monetária"
    instituicao: Fed
    url: "https://www.federalreserve.gov/feeds/press_monetary.xml"
    tipo: comunicado
    idioma: en

  - nome: "Fed — Todos os comunicados"
    instituicao: Fed
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    tipo: comunicado
    idioma: en

  # Os três feeds do BCB deram `400 Bad Request` na primeira coleta real, com o
  # caminho /api/feed/sitebcb/<slug>. O padrão abaixo (/api/servico/, sufixo
  # /ultimas e parâmetro de quantidade) é a forma que o site usa hoje.
  # Continua sendo uma hipótese — mas agora o log traz o corpo da resposta,
  # então a próxima execução diz exatamente o que o servidor recusou.
  - nome: "BCB — Discursos e entrevistas"
    instituicao: BCB
    url: "https://www.bcb.gov.br/api/servico/sitebcb/discursosentrevistas/ultimas?quantidade=100&filtro="
    formato: json_bcb
    tipo: discurso
    idioma: pt
    verificar: true

  - nome: "BCB — Notas e atas do Copom"
    instituicao: BCB
    url: "https://www.bcb.gov.br/api/servico/sitebcb/atascopom/ultimas?quantidade=50&filtro="
    formato: json_bcb
    tipo: ata
    idioma: pt
    verificar: true

  - nome: "BCB — Notícias e comunicados"
    instituicao: BCB
    url: "https://www.bcb.gov.br/api/servico/sitebcb/noticias/ultimas?quantidade=100&filtro="
    formato: json_bcb
    tipo: comunicado
    idioma: pt
    verificar: true

# Removidos após a primeira coleta real, por não responderem:
#   FMI            https://www.imf.org/en/News/RSS?Language=ENG&category=Country  → 403
#   BIS            https://www.bis.org/list/bis_publs/rss.xml                     → 404
#   Banco Mundial  https://www.worldbank.org/en/news/all.rss                      → 404
#   IPEA           https://www.ipea.gov.br/cartadeconjuntura/index.php/feed/      → timeout
# Uma lista curta que funciona vale mais que uma longa que enche o log de aviso.
# Se encontrar as URLs novas, basta acrescentá-las aqui.
research:
  - nome: "Fitch Ratings — Comunicados"
    instituicao: Fitch
    url: "https://www.fitchratings.com/rss/press-releases"
    tipo: rating
    idioma: en
    filtro_titulo: ["Brazil", "Brasil"]
    verificar: true

  - nome: "FGV IBRE — Blog da Conjuntura Econômica"
    instituicao: "FGV IBRE"
    url: "https://blogdoibre.fgv.br/rss.xml"
    tipo: relatorio
    idioma: pt
    verificar: true
