# Endpoints, códigos de série e parâmetros de cada fonte.
#
# Este arquivo existe para que um endpoint que mude de forma — e eles mudam —
# possa ser corrigido aqui, sem alterar código Python. Rode `tesouraria status`
# depois de uma ingestão para ver qual fonte falhou e por quê.
#
# Itens marcados com "verificar: true" não puderam ser testados contra o
# servidor real no ambiente onde o projeto foi gerado (egresso bloqueado por
# política). Confira-os na primeira execução com rede aberta.

sources:

  # ---------------------------------------------------------------- curva BR
  tesouro_direto:
    descricao: "Preços e taxas do Tesouro Direto (Tesouro Transparente, CSV público)"
    url: "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/PrecoTaxaTesouroDireto.csv"
    fixture: "tesouro_direto.csv"
    encoding: "latin-1"
    separador: ";"
    decimal: ","
    # Mapeia o nome do título para o tipo de curva.
    tipos:
      "Tesouro Prefixado": pre
      "Tesouro Prefixado com Juros Semestrais": pre
      "Tesouro IPCA+": ipca
      "Tesouro IPCA+ com Juros Semestrais": ipca
      "Tesouro Selic": selic
      "Tesouro Educa+": ipca
      "Tesouro RendA+": ipca
    # `selic` é pós-fixado e não forma curva a termo; fica fora dos gráficos.
    tipos_curva: [pre, ipca]

  anbima_ettj:
    descricao: "Estrutura a termo da taxa de juros da ANBIMA (curva pré, IPCA e implícita)"
    url: "https://www.anbima.com.br/informacoes/est-termo/CZ-down.asp"
    metodo: POST
    fixture: "anbima_ettj.txt"
    encoding: "latin-1"
    verificar: true
    # Esta fonte só publica um arquivo por dia, então um backfill longo viraria
    # milhares de requisições. O limite pega os dias mais recentes da janela
    # pedida; o histórico se acumula a cada execução diária. A curva BR completa
    # vem do Tesouro Direto, que entrega todo o histórico num CSV só.
    max_dias_por_execucao: 30

  b3_di:
    descricao: "Ajustes do futuro de DI de um dia (DI1) — curva pré negociada"
    url: "https://www2.bmf.com.br/pages/portal/bmfbovespa/boletim1/SistemaPregao_excel1.asp"
    params:
      Mercadoria: "DI1"
    fixture: "b3_di.html"
    encoding: "latin-1"
    verificar: true
    # Mesma limitação da ANBIMA: um boletim por pregão, baixado dia a dia.
    max_dias_por_execucao: 30
    # Códigos de mês dos contratos futuros da B3.
    meses:
      F: 1
      G: 2
      H: 3
      J: 4
      K: 5
      M: 6
      N: 7
      Q: 8
      U: 9
      V: 10
      X: 11
      Z: 12

  # ---------------------------------------------------------------- curva US
  us_treasury:
    descricao: "Daily Treasury Par Yield Curve Rates (nominal e real/TIPS)"
    url_base: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv"
    tipos:
      nominal: "daily_treasury_yield_curve"
      real: "daily_treasury_real_yield_curve"
    fixtures:
      nominal: "us_treasury_nominal.csv"
      real: "us_treasury_real.csv"
    # Conversão do rótulo do vencimento para prazo em anos.
    tenores:
      "1 Mo": 0.0833
      "1.5 Month": 0.125
      "2 Mo": 0.1667
      "3 Mo": 0.25
      "4 Mo": 0.3333
      "6 Mo": 0.5
      "1 Yr": 1.0
      "2 Yr": 2.0
      "3 Yr": 3.0
      "5 Yr": 5.0
      "7 Yr": 7.0
      "10 Yr": 10.0
      "20 Yr": 20.0
      "30 Yr": 30.0

  # ----------------------------------------------------------- séries do BCB
  bcb_sgs:
    descricao: "Sistema Gerenciador de Séries Temporais do Banco Central"
    url_template: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.{codigo}/dados"
    # Catálogo pesquisável das séries (CKAN do portal de dados abertos). É o que
    # transforma "achar o código" de varredura numérica em consulta por nome —
    # ver `tesouraria sgs-buscar`. A nota antiga de que o SGS não tem metadados
    # era falsa, e foi ela que levou a chutar os códigos do fluxo cambial.
    catalogo_url: "https://dadosabertos.bcb.gov.br/api/3/action/package_search"
    fixture: "bcb_sgs.json"
    # A API do SGS limita janelas longas; a ingestão fatia por blocos de anos.
    anos_por_requisicao: 10
    # `faixa: [min, max]` é a faixa plausível da série. Valores fora dela fazem a
    # série ser rejeitada na ingestão, com aviso no log.
    #
    # Isto existe porque um código errado do SGS raramente dá erro: ele devolve
    # *outra* série, com dados perfeitamente válidos e significado nenhum. Foi o
    # que aconteceu na primeira coleta real — o código que eu havia anotado como
    # "exportações" devolvia valores negativos de seis dígitos. A faixa é o que
    # transforma esse erro silencioso em falha visível.
    series:
      - { codigo: 432,   nome: "Selic meta",                     unidade: "% a.a.",      pais: BR, faixa: [0, 50] }
      - { codigo: 11,    nome: "Selic over",                     unidade: "% a.d.",      pais: BR, faixa: [0, 0.5] }
      - { codigo: 12,    nome: "CDI",                            unidade: "% a.d.",      pais: BR, faixa: [0, 0.5] }
      - { codigo: 4389,  nome: "Selic acumulada anualizada",     unidade: "% a.a.",      pais: BR, faixa: [0, 50] }
      - { codigo: 1,     nome: "Dólar PTAX venda",               unidade: "R$/US$",      pais: BR, faixa: [0.5, 20] }
      - { codigo: 10813, nome: "Dólar PTAX compra",              unidade: "R$/US$",      pais: BR, faixa: [0.5, 20] }
      - { codigo: 433,   nome: "IPCA mensal",                    unidade: "% a.m.",      pais: BR, faixa: [-3, 5] }
      - { codigo: 13522, nome: "IPCA acumulado 12 meses",        unidade: "%",           pais: BR, faixa: [-5, 40] }
      - { codigo: 189,   nome: "IGP-M mensal",                   unidade: "% a.m.",      pais: BR, faixa: [-10, 10] }
      - { codigo: 24363, nome: "IBC-Br",                         unidade: "índice",      pais: BR, faixa: [50, 200] }
      - { codigo: 24364, nome: "IBC-Br dessazonalizado",         unidade: "índice",      pais: BR, faixa: [50, 200] }
      - { codigo: 24369, nome: "Taxa de desocupação (PNADC)",    unidade: "%",           pais: BR, faixa: [2, 30] }
      - { codigo: 4503,  nome: "Dívida líquida do setor público", unidade: "% do PIB",   pais: BR, faixa: [0, 120] }

    # Removidas na revisão da primeira coleta real, por não serem o que o nome
    # dizia. Reencontre os códigos corretos em https://www3.bcb.gov.br/sgspub/
    # e confirme com `tesouraria sgs-probe` antes de reativar:
    #   2255 — anotada como "Exportações (FOB)"; devolvia até -171.782 (export
    #          não é negativa) e média 360, contra os ~30.000 US$ mi/mês reais
    #   2256, 2257 — 404, não existem
    #   4192 — anotada como "Reservas internacionais"; devolvia 2.527.885 contra
    #          os ~340.000 US$ mi reais

  fx_flow:
    descricao: "Fluxo cambial contratado (movimento de câmbio) do Banco Central"
    url_template: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.{codigo}/dados"
    fixture: "fx_flow.json"
    # DESATIVADA até que os códigos corretos sejam identificados.
    #
    # Os códigos 22707–22715 eram um palpite, e a primeira coleta real provou
    # que estavam errados. As evidências, medidas sobre os próprios dados:
    #
    #   * `comercial` e `financeiro` tinham correlação 1,000000 e diferença
    #     média de 0,46 — eram a mesma série, não dois segmentos;
    #   * `comercial + financeiro` não batia com `total`: erro médio de 36.881;
    #   * `total` ficava entre -33 e -8, mil vezes menor que as outras duas, e
    #     negativo em 139 de 139 observações — era isto que a interface exibia
    #     como "fluxo cambial sempre negativo";
    #   * a periodicidade era mensal, não semanal;
    #   * a correlação com a balança comercial era +0,19, quando o fluxo
    #     comercial deveria acompanhá-la de perto.
    #
    # Mostrar esses números seria pior que não mostrar nada. Enquanto a lista
    # estiver vazia, a fonte é registrada como `pulado` e a página de fluxo
    # cambial explica o que falta.
    #
    # Para reativar: rode o workflow "Sondar séries do SGS" varrendo a faixa
    # 22600–22800, identifique no log as séries semanais em US$ milhões com
    # troca de sinal, e preencha abaixo.
    series: []
    periodicidade: semanal

  focus:
    descricao: "Expectativas de mercado do relatório Focus (API Olinda, OData)"
    url_base: "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata"
    fixtures:
      geral: "focus_geral.json"
      top5: "focus_top5.json"
    endpoints:
      geral: "ExpectativasMercadoAnuais"
      top5: "ExpectativasMercadoTop5Anuais"
    indicadores: ["IPCA", "Selic", "Câmbio", "PIB Total"]
    pagina: 10000

  # -------------------------------------------------------- comércio externo
  comex:
    descricao: "Balança comercial detalhada (Comex Stat / MDIC)"
    url: "https://api-comexstat.mdic.gov.br/general"
    metodo: POST
    fixture: "comex.json"
    verificar: true
    # Sem esta fonte, a página de balança comercial ainda funciona com as
    # séries 2255/2256/2257 do SGS.

  # ------------------------------------------------------------ macro Brasil
  ibge_sidra:
    descricao: "Tabelas do SIDRA/IBGE: IPCA, desemprego, PIB e atividade"
    url_template: "https://apisidra.ibge.gov.br/values/t/{tabela}/n1/all/v/{variavel}/p/all"
    fixture: "ibge_sidra.json"
    series:
      - { tabela: 1737, variavel: 63,   nome: "IPCA variação mensal",    unidade: "%", faixa: [-3, 5] }
      - { tabela: 1737, variavel: 2265, nome: "IPCA acumulado 12 meses", unidade: "%", faixa: [-5, 40] }
      - { tabela: 6381, variavel: 4099, nome: "Taxa de desocupação",     unidade: "%", faixa: [2, 30] }
    # Removidas: 5932-6564 (PIB) e 8880-7169 (PMC) devolveram só NaN na coleta
    # real — a combinação tabela/variável existe, mas não traz valor. Confirme
    # o par correto em https://sidra.ibge.gov.br/ antes de reativar.

  # -------------------------------------------------------------- macro EUA
  us_macro:
    descricao: "Séries macroeconômicas americanas (FRED)"
    url: "https://api.stlouisfed.org/fred/series/observations"
    fixture: "us_macro.json"
    # Sem FRED_API_KEY a fonte é pulada e registrada como tal em ingest_log.
    series:
      - { serie_id: "FEDFUNDS",  nome: "Fed Funds effective rate", unidade: "% a.a.",     faixa: [0, 25] }
      - { serie_id: "DFF",       nome: "Fed Funds diário",         unidade: "% a.a.",     faixa: [0, 25] }
      - { serie_id: "CPIAUCSL",  nome: "CPI",                      unidade: "índice",     faixa: [100, 1000] }
      - { serie_id: "CPILFESL",  nome: "Core CPI",                 unidade: "índice",     faixa: [100, 1000] }
      - { serie_id: "UNRATE",    nome: "Taxa de desemprego",       unidade: "%",          faixa: [1, 30] }
      - { serie_id: "PAYEMS",    nome: "Nonfarm payrolls",         unidade: "mil pessoas", faixa: [50000, 400000] }
      - { serie_id: "T10Y2Y",    nome: "Inclinação 10a-2a",        unidade: "p.p.", faixa: [-5, 5] }

      # Cestas do dólar, usadas no prêmio do real (analytics/currency.py).
      #
      # A `broad` inclui o próprio real: serve de referência geral, mas não
      # para medir o descolamento do real — parte do movimento apareceria dos
      # dois lados da conta. As duas abaixo excluem o Brasil e são as réguas:
      #   avançadas — o análogo mais fiel ao DXY da ICE;
      #   emergentes — responde "o real andou pior que os pares?".
      - { serie_id: "DTWEXBGS",   nome: "Dólar — cesta ampla",       unidade: "índice", faixa: [50, 200] }
      - { serie_id: "DTWEXAFEGS", nome: "Dólar — economias avançadas", unidade: "índice", faixa: [50, 200] }
      - { serie_id: "DTWEXEMEGS", nome: "Dólar — emergentes",        unidade: "índice", faixa: [50, 250] }

# Grade padrão de vértices (em anos) usada para tornar as curvas comparáveis.
grade_padrao: [0.25, 0.5, 1.0, 2.0, 3.0, 5.0, 7.0, 10.0, 15.0, 20.0, 30.0]

# Convenções de contagem de dias, aplicadas antes de qualquer subtração entre
# curvas. Ver `analytics/curve.py`.
convencoes:
  br:
    base_dias: 252            # taxa efetiva anual em dias úteis
    capitalizacao: anual
  us:
    base_dias: 365
    capitalizacao: semestral  # par yield é bond-equivalent
